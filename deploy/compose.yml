# The whole stack, from published images. Runs as a custom app on TrueNAS SCALE
# or on any Docker host; dev/compose.yml builds the same stack from source.
#
# Recordings come from two places:
# - FOOTAGE_DIR, a folder something else records to (a NAS share), indexed in
#   place and mounted read-only. Optional.
# - The library, where uploads go: FOOTAGE_LIBRARY_DIR, or a named volume.
# FOOTAGE_DATA_DIR and FOOTAGE_DB_DIR put proxies and the database on their own
# datasets. The core and worker run as uid 1000, which needs read access to the
# recordings and write access to the library and data folders.
# More watched folders: mount each in both core and worker at the same path and
# list them in FOOTAGE_WATCH, e.g. footage=file:///footage;cams=file:///cams.
name: matick-footage

x-database: &database
  FOOTAGE_DATABASE_URL: postgres://footage:${POSTGRES_PASSWORD:-footage}@postgres:5432/footage?sslmode=disable

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: footage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-footage}
      POSTGRES_DB: footage
    volumes:
      - ${FOOTAGE_DB_DIR:-db}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footage -d footage"]
      interval: 5s
      timeout: 3s
      retries: 30

  core:
    image: ghcr.io/matick-io/matick-footage-core:${FOOTAGE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database
      FOOTAGE_WATCH: ${FOOTAGE_WATCH:-footage=file:///footage}
      FOOTAGE_SCAN_INTERVAL: ${FOOTAGE_SCAN_INTERVAL:-30s}
      FOOTAGE_STABLE_FOR: ${FOOTAGE_STABLE_FOR:-1m}
      FOOTAGE_TRANSCRIBE_MODEL: ${FOOTAGE_TRANSCRIBE_MODEL:-small}
      FOOTAGE_UPLOAD_MAX: ${FOOTAGE_UPLOAD_MAX:-50G}
      # Where editing machines see each source, per target:
      # Resolve=footage:/Volumes/footage|library:/Volumes/library;Premiere=footage:\\nas\footage
      FOOTAGE_EXPORT_TARGETS: ${FOOTAGE_EXPORT_TARGETS:-}
    volumes:
      - ${FOOTAGE_DIR:-footage}:/footage:ro
      - ${FOOTAGE_LIBRARY_DIR:-library}:/library
      - ${FOOTAGE_DATA_DIR:-data}:/data
    ports:
      - "${FOOTAGE_PORT:-8420}:8080"

  worker-media:
    image: ghcr.io/matick-io/matick-footage-worker:${FOOTAGE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_started
    environment:
      <<: *database
      FOOTAGE_CORE_URL: http://core:8080
      WORKER_STAGES: probe,proxy,transcribe
      # cpu or cuda. The GPU also needs passing through; see gpu-nvidia.yml.
      FOOTAGE_PROXY_DEVICE: ${FOOTAGE_PROXY_DEVICE:-cpu}
      FOOTAGE_WHISPER_LANGUAGE: ${FOOTAGE_WHISPER_LANGUAGE:-}
    volumes:
      - ${FOOTAGE_DIR:-footage}:/footage:ro
      - ${FOOTAGE_LIBRARY_DIR:-library}:/library:ro
      - ${FOOTAGE_DATA_DIR:-data}:/data
      - models:/models

volumes:
  db:
  footage:
  library:
  data:
  models:
